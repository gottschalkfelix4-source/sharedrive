services:
  backend:
    image: ${SHAREDRIVE_IMAGE:-ghcr.io/gottschalkfelix4-source/sharedrive:latest}
    container_name: sharedrive-backend
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      SETUP_TOKEN_FILE: /app/.setup/token
    ports:
      - "${HTTP_PORT:-8088}:3000"
    mem_limit: 1g
    cpus: 2
    volumes:
      - ./.setup:/app/.setup
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sharedrive-net

  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    container_name: sharedrive-postgres
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sharedrive}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - sharedrive-net

  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    command: [redis-server, --appendonly, "yes"]
    container_name: sharedrive-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - sharedrive-net

  minio:
    image: ${MINIO_IMAGE:-ghcr.io/gottschalkfelix4-source/sharedrive-minio:latest}
    container_name: sharedrive-minio
    command: server /data --console-address ":9001"
    env_file: .env
    volumes:
      - minio_data:/data
    # Storage API and console remain private to the Docker network.
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/ready]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - sharedrive-net

  clamav:
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    container_name: sharedrive-clamav
    environment:
      # Raise stream/file limits well above the app's default 5 GB max file size
      CLAMD_CONF_StreamMaxLength: 6144M
      CLAMD_CONF_MaxFileSize: 6144M
      CLAMD_CONF_MaxScanSize: 6144M
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_TCPSocket: 3310
      CLAMD_CONF_TCPAddr: "0.0.0.0"
    volumes:
      - clamav_data:/var/lib/clamav
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: [CMD, clamdscan, --ping, "1"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 10
    restart: unless-stopped
    networks:
      - sharedrive-net

networks:
  sharedrive-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
